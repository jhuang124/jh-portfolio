<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Process Pipeline — Component Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['DM Sans', 'sans-serif'], mono: ['DM Mono', 'monospace'] } } }
    }
  </script>
  <style>
    .grain { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); }
    @keyframes packetPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
    .packet-glow { animation: packetPulse 1.8s ease-in-out infinite; }
    @keyframes slideIn { from { opacity:0; transform: translateX(-8px); } to { opacity:1; transform: translateX(0); } }
    .slide-in { animation: slideIn 0.35s ease-out; }
  </style>
</head>
<body class="bg-[#0a0e1a] text-slate-200 font-sans grain min-h-screen">

  <div class="max-w-5xl mx-auto px-8 pt-20 pb-8">
    <div class="text-[#f0abfc] font-mono text-xs tracking-[0.25em] mb-3 uppercase">Component 02</div>
    <h1 class="text-4xl font-bold text-white mb-3 tracking-tight">Animated Process Pipeline</h1>
    <p class="text-slate-400 max-w-xl leading-relaxed">Data flows through transformation stages. Step through, inspect intermediate state, predict what the next transform produces. The universal input → transform → output visualizer.</p>
  </div>

  <div id="app"></div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10';
    import { useState, useCallback } from 'https://esm.sh/preact@10/hooks';
    import htm from 'https://esm.sh/htm@3';
    const html = htm.bind(h);

    // ── The Reusable Component ──────────────────────────────

    function ProcessPipeline({ stages, packetLabel }) {
      const [currentStage, setCurrentStage] = useState(-1);
      const [showPredict, setShowPredict] = useState(false);
      const [predicted, setPredicted] = useState(false);
      const atEnd = currentStage >= stages.length - 1;
      const atStart = currentStage < 0;

      function step() {
        if (atEnd) return;
        if (!predicted && currentStage >= 0 && currentStage < stages.length - 1) {
          setShowPredict(true);
          return;
        }
        setCurrentStage(s => s + 1);
        setShowPredict(false);
        setPredicted(false);
      }

      function confirmPredict() {
        setPredicted(true);
        setShowPredict(false);
        setCurrentStage(s => s + 1);
      }

      function reset() {
        setCurrentStage(-1);
        setShowPredict(false);
        setPredicted(false);
      }

      function back() {
        if (currentStage >= 0) {
          setCurrentStage(s => s - 1);
          setShowPredict(false);
          setPredicted(false);
        }
      }

      return html`
        <div class="max-w-5xl mx-auto px-8 py-12">
          <!-- Pipeline visualization -->
          <div class="relative mb-8">
            <!-- Connection line -->
            <div class="absolute top-10 left-0 right-0 h-[2px] bg-slate-800 mx-16"></div>
            <div class="absolute top-10 left-0 h-[2px] bg-gradient-to-r from-[#f0abfc]/60 to-[#f0abfc]/0 mx-16 transition-all duration-500"
              style=${{ width: currentStage < 0 ? '0%' : ((currentStage + 1) / stages.length * 100) + '%' }}></div>

            <!-- Stage nodes -->
            <div class="relative flex justify-between">
              ${stages.map((stage, i) => {
                const isActive = i === currentStage;
                const isPast = i < currentStage;
                const isFuture = i > currentStage;
                const isPacketHere = i === currentStage;
                return html`
                  <div key=${i} class="flex flex-col items-center" style=${{ width: (100 / stages.length) + '%' }}>
                    <!-- Node circle -->
                    <div class="relative">
                      ${isPacketHere && html`
                        <div class="absolute -inset-2 rounded-full bg-[#f0abfc]/15 packet-glow"></div>
                      `}
                      <div class=${"w-[22px] h-[22px] rounded-full border-2 relative z-10 transition-all duration-400 flex items-center justify-center " +
                        (isActive ? "border-[#f0abfc] bg-[#f0abfc]/20 scale-110" :
                         isPast ? "border-[#f0abfc]/50 bg-[#f0abfc]/10" :
                         "border-slate-700 bg-[#0d1320]")}>
                        ${isPast && html`<svg class="w-3 h-3 text-[#f0abfc]" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="2" fill="none"/></svg>`}
                      </div>
                    </div>
                    <!-- Label -->
                    <div class=${"mt-3 text-center transition-all duration-300 " + (isActive ? "opacity-100" : isPast ? "opacity-50" : "opacity-30")}>
                      <div class=${"font-mono text-[10px] tracking-wider uppercase mb-1 " + (isActive ? "text-[#f0abfc]" : "text-slate-500")}>${stage.label}</div>
                      <div class=${"text-xs font-medium " + (isActive ? "text-white" : "text-slate-500")}>${stage.name}</div>
                    </div>
                  </div>
                `;
              })}
            </div>
          </div>

          <!-- Stage detail card -->
          <div class="min-h-[280px]">
            ${currentStage < 0 && html`
              <div class="bg-[#0d1320] rounded-2xl border border-slate-800/60 p-8 text-center">
                <div class="text-slate-500 font-mono text-xs mb-3 uppercase tracking-wider">Ready</div>
                <div class="inline-flex items-center gap-3 bg-[#f0abfc]/10 border border-[#f0abfc]/20 rounded-xl px-5 py-3 mb-4">
                  <div class="w-3 h-3 rounded-full bg-[#f0abfc]"></div>
                  <span class="font-mono text-sm text-[#f0abfc]">${packetLabel || "Data"}</span>
                </div>
                <p class="text-slate-400 text-sm">Click <span class="text-white font-medium">Step</span> to send the packet into the pipeline.</p>
              </div>
            `}

            ${currentStage >= 0 && !showPredict && html`
              <div class="bg-[#0d1320] rounded-2xl border border-slate-800/60 overflow-hidden slide-in" key=${currentStage}>
                <div class="px-6 py-4 border-b border-slate-800/60 flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <div class="w-2.5 h-2.5 rounded-full bg-[#f0abfc] packet-glow"></div>
                    <span class="font-mono text-xs text-[#f0abfc] tracking-wider uppercase">${stages[currentStage].label}: ${stages[currentStage].name}</span>
                  </div>
                  <span class="text-slate-600 text-xs font-mono">${currentStage + 1}/${stages.length}</span>
                </div>
                <div class="p-6">
                  <p class="text-slate-300 text-sm mb-5 leading-relaxed">${stages[currentStage].description}</p>

                  <!-- Packet state -->
                  <div class="bg-[#0a0e1a] rounded-xl border border-slate-800/40 p-4">
                    <div class="text-slate-500 font-mono text-[10px] tracking-wider uppercase mb-3">Packet State</div>
                    <div class="font-mono text-sm space-y-1.5">
                      ${Object.entries(stages[currentStage].state).map(([k, v]) => html`
                        <div class="flex gap-3" key=${k}>
                          <span class="text-slate-500 w-36 shrink-0 truncate">${k}:</span>
                          <span class=${"transition-all duration-300 " +
                            (stages[currentStage].changed && stages[currentStage].changed.includes(k) ? "text-[#f0abfc] font-medium" : "text-slate-300")}>${v}</span>
                          ${stages[currentStage].changed && stages[currentStage].changed.includes(k) && html`
                            <span class="text-[#f0abfc]/50 text-xs ml-auto">changed</span>
                          `}
                        </div>
                      `)}
                    </div>
                  </div>
                </div>
              </div>
            `}

            ${showPredict && html`
              <div class="bg-[#0d1320] rounded-2xl border border-[#f0abfc]/30 p-8 text-center slide-in">
                <div class="text-[#f0abfc] font-mono text-xs tracking-wider uppercase mb-3">Predict</div>
                <p class="text-white font-medium mb-2">${stages[currentStage + 1].predict || "What happens at the next stage?"}</p>
                <p class="text-slate-400 text-sm mb-6">Think about it before stepping forward.</p>
                <button onClick=${confirmPredict}
                  class="px-6 py-2.5 bg-[#f0abfc]/15 hover:bg-[#f0abfc]/25 border border-[#f0abfc]/30 text-[#f0abfc] rounded-xl font-medium text-sm transition-all">
                  I have a prediction → Reveal
                </button>
              </div>
            `}
          </div>

          <!-- Controls -->
          <div class="flex items-center justify-center gap-3 mt-6">
            <button onClick=${reset} disabled=${atStart}
              class=${"px-4 py-2 rounded-xl text-sm font-medium transition-all border " +
                (atStart ? "border-slate-800 text-slate-700 cursor-not-allowed" : "border-slate-700 text-slate-400 hover:text-white hover:border-slate-600")}>
              Reset
            </button>
            <button onClick=${back} disabled=${atStart}
              class=${"px-4 py-2 rounded-xl text-sm font-medium transition-all border " +
                (atStart ? "border-slate-800 text-slate-700 cursor-not-allowed" : "border-slate-700 text-slate-400 hover:text-white hover:border-slate-600")}>
              ← Back
            </button>
            <button onClick=${step} disabled=${atEnd}
              class=${"px-8 py-2.5 rounded-xl text-sm font-medium transition-all " +
                (atEnd ? "bg-slate-800 text-slate-600 cursor-not-allowed" :
                 "bg-[#f0abfc]/15 hover:bg-[#f0abfc]/25 border border-[#f0abfc]/30 text-[#f0abfc]")}>
              ${atEnd ? "Complete" : atStart ? "Step →" : "Step →"}
            </button>
          </div>
        </div>
      `;
    }

    // ── Demo: Skill Loading Pipeline ────────────────────────

    const demoStages = [
      {
        label: "Stage 1", name: "Frontmatter Scan",
        description: "Claude's system prompt contains the description field from every installed skill. This is Level 1 of progressive disclosure — always loaded, always consuming context budget.",
        state: { source: "System prompt", descriptions_loaded: "24 skills", chars_used: "3,840 / 8,000", body_loaded: "none", tools_granted: "none" },
        changed: ["descriptions_loaded", "chars_used"],
      },
      {
        label: "Stage 2", name: "Semantic Matching",
        description: "Claude reads the user's query and compares it against all 24 skill descriptions using LLM reasoning. Not keyword matching — semantic understanding of intent. The best match is selected.",
        state: { source: "User query", descriptions_loaded: "24 skills", match: "pr-writer (score: high)", runner_up: "code-reviewer (score: low)", body_loaded: "none", tools_granted: "none" },
        changed: ["source", "match", "runner_up"],
        predict: "What determines whether a skill matches — keywords in the description, or semantic similarity to the user's intent?",
      },
      {
        label: "Stage 3", name: "Body Injection",
        description: "The winning skill's full SKILL.md body is loaded into context via a hidden message. This is Level 2 — loaded only on trigger. The user sees a visible metadata message ('pr-writer skill is loading').",
        state: { source: "SKILL.md body", descriptions_loaded: "24 skills", match: "pr-writer", body_loaded: "pr-writer (142 lines)", messages_injected: "2 (meta + prompt)", tools_granted: "none" },
        changed: ["source", "body_loaded", "messages_injected"],
        predict: "The skill has 142 lines of instructions. Were these in Claude's context before this step?",
      },
      {
        label: "Stage 4", name: "Permission Grant",
        description: "The skill's allowed-tools field is applied. Tools listed here are pre-approved — no user confirmation needed while the skill is active. This is scope-limited: only the tools the skill declared.",
        state: { source: "Frontmatter: allowed-tools", match: "pr-writer", body_loaded: "pr-writer (142 lines)", tools_granted: "Read, Grep, Bash(git diff *)", scope: "skill duration only" },
        changed: ["tools_granted", "scope"],
        predict: "If the skill lists 'Read, Grep, Bash(git diff *)' in allowed-tools, can Claude also use Write during this skill's execution?",
      },
      {
        label: "Stage 5", name: "Execution & Revert",
        description: "Claude executes the task using the skill's instructions and granted tools. When done, the skill context reverts — the body unloads, tool permissions return to normal, and the conversation continues without the skill's overhead.",
        state: { source: "Execution complete", match: "pr-writer", body_loaded: "unloaded ✓", tools_granted: "reverted to session defaults", output: "PR description generated" },
        changed: ["body_loaded", "tools_granted", "output"],
      },
    ];

    function App() {
      return html`<${ProcessPipeline} stages=${demoStages} packetLabel=${"User: 'Generate PR from staged changes'"} />`;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
